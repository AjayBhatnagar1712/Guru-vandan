<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Guru Vandan brings daily satsang, meditation, aarti and wisdom from Maharshi Mehi Paramhans to the web, Android and iPhone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guru Vandan" />
    <meta property="og:title" content="Guru Vandan" />
    <meta property="og:description" content="Daily satsang, meditation, aarti and wisdom from Maharshi Mehi Paramhans." />
    <meta property="og:url" content="https://guru-vandan.web.app/" />
    <meta property="og:image" content="https://guru-vandan.web.app/icons/Icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-itunes-app" content="app-id=6807657972, app-argument=guruvandan://home" />
    <meta name="theme-color" content="#7b171d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://guru-vandan.web.app/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/Icon-192.png" />
    <title>Guru Vandan</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fbf6ec; }
      #web-loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #fffdf8, #f5e7cf);
        color: #7b171d;
        font-family: Georgia, serif;
        transition: opacity .2s ease;
      }
      #web-loading div { text-align: center; }
      #web-loading img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 14px 34px rgba(84,16,20,.15); }
      #web-loading p { margin: 18px 0 0; font-size: 28px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="web-loading" aria-label="Loading Guru Vandan">
      <div>
        <img src="icons/Icon-192.png" alt="" />
        <p>Guru Vandan</p>
      </div>
    </div>
    <script>
      window.addEventListener('flutter-first-frame', () => {
        const loading = document.getElementById('web-loading');
        if (!loading) return;
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 220);
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
