name: guruvandan_flutter
description: A spiritual routine tracker for satsang, meditation, Sadguru quotes, and admin-managed devotional content.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_database: ^11.2.0
  firebase_storage: ^12.3.7
  google_fonts: ^6.2.1
  intl: ^0.20.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/app_icon.png
    - assets/images/guru_image.jpeg
    - assets/audio/meditation_chant.mp3
    - assets/audio/morning_satsang_sample.mp4
    - assets/audio/shaam_satsang_full.mp3
